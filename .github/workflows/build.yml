name: build

# NOTE: the released AccDrive.app is UNSIGNED. Code signing requires an Apple
# Developer team (App Group + FileProvider testing-mode entitlements), which is
# not available in CI. To actually run the app, users must re-sign it with their
# own Apple Developer team. This workflow only verifies that the project compiles
# and produces an unsigned artifact.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Config.plist
        # AccDrive ships its own public (PKCE) Client ID. It is a public
        # identifier and there is no client secret, so it is safe to embed in
        # the released binary (Option 1 "turnkey" in the README).
        run: |
          cat > Config.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>APS_CLIENT_ID</key>
          <string>BJi0IecwujUIBNqdh0qKsTKwYhKjpPEwnjZZSqATfZguyZyo</string>
          <key>APS_REDIRECT_URI</key>
          <string>accdrive://oauth/callback</string>
          <key>MOCK_MODE</key>
          <false/>
          </dict>
          </plist>
          PLIST

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project AccDrive.xcodeproj -scheme AccDrive \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare Config.plist
        # AccDrive ships its own public (PKCE) Client ID. It is a public
        # identifier and there is no client secret, so it is safe to embed in
        # the released binary (Option 1 "turnkey" in the README).
        run: |
          cat > Config.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>APS_CLIENT_ID</key>
          <string>BJi0IecwujUIBNqdh0qKsTKwYhKjpPEwnjZZSqATfZguyZyo</string>
          <key>APS_REDIRECT_URI</key>
          <string>accdrive://oauth/callback</string>
          <key>MOCK_MODE</key>
          <false/>
          </dict>
          </plist>
          PLIST

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project AccDrive.xcodeproj -scheme AccDrive \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Locate and zip AccDrive.app
        run: |
          APP_PATH=$(find build -name 'AccDrive.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "AccDrive.app not found" >&2
            exit 1
          fi
          echo "Found app at $APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" AccDrive.app.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AccDrive.app.zip
